<!doctype html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
{{ partial "head.html" . }}
<body><a class="skip-link" href="#main">Skip to content</a>
<div class="shell">{{ partial "header.html" . }}<div>
<main id="main" class="site-main" tabindex="-1">{{ block "main" . }}{{ end }}</main>
{{ partial "footer.html" . }}</div></div>
<script src="{{ "js/nightfall.js" | relURL }}?{{ .Site.Params.theme_seconds }}" defer></script>
{{ range .Site.Params.plugins_js }}<script src="{{ . }}"></script>{{ end }}
</body></html>
