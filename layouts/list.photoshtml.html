{{ define "main" }}<h1>Photos</h1><div class="photos-grid">{{ range where .Site.RegularPages "Params.photos" "!=" nil }}{{ $page := . }}{{ range first 1 .Params.photos }}<a href="{{ $page.RelPermalink }}"><img src="{{ . }}" loading="lazy" width="300" height="300" alt="{{ $page.Title | default (printf "Photo post from %s" ($page.Date.Format "Jan 2, 2006")) }}"></a>{{ end }}{{ end }}</div>{{ end }}
