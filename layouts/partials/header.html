<header class="site-header h-card">
<a class="brand p-name u-url" href="{{ "/" | relURL }}"><span class="brand-mark" aria-hidden="true">☾</span>{{ .Site.Title }}</a>
{{ with .Site.Params.description }}<div class="description p-note">{{ . | safeHTML }}</div>{{ end }}
<nav class="site-nav" aria-label="Main navigation">
<a href="{{ "/" | relURL }}"{{ if .IsHome }} aria-current="page"{{ end }}>Journal</a>
{{ range .Site.Menus.main }}<a href="{{ .URL | relURL }}">{{ .Name }}</a>{{ end }}
<a href="{{ "feed.xml" | relURL }}">RSS feed</a>
</nav></header>
