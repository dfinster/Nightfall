<header class="site-header h-card">
  <a class="brand p-name u-url" href="{{ "/" | relURL }}">
    {{- with .Site.Params.author.avatar -}}
      <img class="profile-avatar u-photo" src="{{ . }}" alt="" width="80" height="80">
    {{- end -}}
    {{ .Site.Title }}
  </a>

  {{ with .Site.Params.description }}
    <div class="description p-note">{{ . | safeHTML }}</div>
  {{ end }}

  <nav class="site-nav" aria-label="Main navigation">
    <a href="{{ "/" | relURL }}">Posts</a>
    {{ range .Site.Menus.main }}
      <a href="{{ .URL | relURL }}">{{ .Name }}</a>
    {{ end }}
  </nav>

  <script>
    (() => {
      const nav = document.currentScript.previousElementSibling;
      const normalize = path => path.replace(/\/+$/, '') || '/';
      const currentPath = normalize(window.location.pathname);

      nav.querySelectorAll('a[href]').forEach(link => {
        const url = new URL(link.href, window.location.href);
        const active = url.origin === window.location.origin &&
          normalize(url.pathname) === currentPath;

        if (active) {
          link.setAttribute('aria-current', 'page');
        } else {
          link.removeAttribute('aria-current');
        }
      });
    })();
  </script>
</header>
