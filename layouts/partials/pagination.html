{{ $p := .Paginator }}{{ if gt $p.TotalPages 1 }}<nav class="pagination" aria-label="Pagination"><span>{{ if $p.HasPrev }}<a href="{{ $p.Prev.URL }}" rel="prev">← Newer posts</a>{{ end }}</span><span>{{ $p.PageNumber }} / {{ $p.TotalPages }}</span><span>{{ if $p.HasNext }}<a href="{{ $p.Next.URL }}" rel="next">Older posts →</a>{{ end }}</span></nav>{{ end }}
